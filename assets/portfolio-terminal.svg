<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Shi Hongjie AI Product Portfolio</title>
  <desc id="desc">Animated terminal introduction for AI Product Manager Shi Hongjie</desc>
  <style>
    :root { color-scheme: dark; }
    .bg { fill: #0b1220; }
    .panel { fill: #111827; stroke: #263244; stroke-width: 2; }
    .bar { fill: #172033; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .meta { fill: #7f8ea3; font-size: 13px; letter-spacing: 1px; }
    .title { fill: #e5edf7; font-size: 23px; font-weight: 700; }
    .body { fill: #aebdce; font-size: 17px; }
    .ok { fill: #5ee6a8; font-weight: 700; }
    .prompt { fill: #62a8ff; font-size: 17px; font-weight: 700; }
    .ready { fill: #5ee6a8; font-size: 20px; font-weight: 700; }
    .cta { fill: #8dbdff; font-size: 14px; letter-spacing: 2px; }
    .line { opacity: 0; animation: reveal 9s ease-in-out infinite; }
    .l1 { animation-delay: .2s; } .l2 { animation-delay: .55s; }
    .l3 { animation-delay: .9s; } .l4 { animation-delay: 1.25s; }
    .l5 { animation-delay: 1.6s; } .l6 { animation-delay: 1.95s; }
    .l7 { animation-delay: 2.3s; } .l8 { animation-delay: 2.65s; }
    .pulse { opacity: 0; animation: pulse 9s ease-in-out infinite; animation-delay: 3s; }
    .cursor { fill: #62a8ff; animation: blink .8s steps(1) infinite; }
    @keyframes reveal { 0%,5%{opacity:0;transform:translateY(6px)} 11%,78%{opacity:1;transform:translateY(0)} 90%,100%{opacity:0} }
    @keyframes pulse { 0%,37%{opacity:0} 46%,82%{opacity:1} 92%,100%{opacity:0} }
    @keyframes blink { 0%,48%{opacity:1} 49%,100%{opacity:0} }
    @media (prefers-reduced-motion: reduce) { .line,.pulse,.cursor{animation:none;opacity:1} }
  </style>
  <rect class="bg" width="1000" height="500" rx="20"/>
  <rect class="panel" x="12" y="12" width="976" height="476" rx="16"/>
  <path class="bar" d="M28 13h944a15 15 0 0 1 15 15v39H13V28a15 15 0 0 1 15-15z"/>
  <circle cx="39" cy="40" r="7" fill="#ff6b6b"/>
  <circle cx="64" cy="40" r="7" fill="#ffd166"/>
  <circle cx="89" cy="40" r="7" fill="#5ee6a8"/>
  <text class="mono meta" x="500" y="45" text-anchor="middle">shihongjie@ai-product — portfolio</text>
  <text class="mono title line l1" x="58" y="108">SHI HONGJIE · AI PRODUCT MANAGER</text>
  <text class="mono body line l2" x="58" y="148">[ <tspan class="ok">OK</tspan> ] Starting from real user problems</text>
  <text class="mono body line l3" x="58" y="181">[ <tspan class="ok">OK</tspan> ] Orchestrating agent workflows</text>
  <text class="mono body line l4" x="58" y="214">[ <tspan class="ok">OK</tspan> ] Grounding answers with RAG evidence</text>
  <text class="mono body line l5" x="58" y="247">[ <tspan class="ok">OK</tspan> ] Validating AI with evals and guardrails</text>
  <text class="mono prompt line l6" x="58" y="302">shihongjie@ai-product ~ % <tspan class="body">whoami</tspan></text>
  <text class="mono body line l7" x="58" y="337">5 years in product · 2 years focused on AI · Beijing</text>
  <text class="mono prompt line l8" x="58" y="385">shihongjie@ai-product ~ % <tspan class="body">open selected-work</tspan><rect class="cursor" x="718" y="366" width="10" height="23"/></text>
  <text class="mono ready pulse" x="58" y="429">SYSTEM READY</text>
  <text class="mono cta pulse" x="500" y="463" text-anchor="middle">EXPLORE THE PROJECTS BELOW ↓</text>
</svg>
